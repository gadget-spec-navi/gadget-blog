<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" role="img"
     aria-label="対応コーデックの伝送レート比較。AirPods Pro 第2世代は AAC で最大256kbps、WF-1000XM5 は LDAC で最大990kbps。">
  <title>対応コーデックが扱える情報量の上限</title>

  <style>
    .f     { font-family: 'Hiragino Sans','Hiragino Kaku Gothic ProN','Helvetica Neue',Arial,sans-serif; }
    .title { font-size: 38px; font-weight: 600; letter-spacing: -0.015em; fill: #1d1d1f; }
    .lede  { font-size: 24px; fill: #6e6e73; }
    .name  { font-size: 26px; font-weight: 600; fill: #1d1d1f; }
    .codec { font-size: 24px; fill: #6e6e73; }
    .val   { font-size: 32px; font-weight: 600; fill: #1d1d1f; }
    .cap   { font-size: 21px; fill: #86868b; }
  </style>

  <rect width="1600" height="680" fill="#ffffff"/>
  <rect x="30" y="30" width="1540" height="620" rx="28" fill="#f5f5f7"/>

  <text class="f title" x="90" y="118">伝送できる情報量の上限</text>
  <text class="f lede"  x="90" y="164">対応コーデックの最大ビットレート（kbps）</text>

  <line x1="90" y1="210" x2="1510" y2="210" stroke="#d2d2d7" stroke-width="2"/>

  <!-- AirPods Pro（第2世代）: AAC 256kbps -->
  <text class="f name"  x="90" y="288">AirPods Pro（第2世代）</text>
  <text class="f codec" x="440" y="288">SBC / AAC</text>
  <path d="M90 310 L362 310 Q372 310 372 320 L372 348 Q372 358 362 358 L90 358 Z" fill="#0071e3"/>
  <text class="f val"   x="396" y="348">256 kbps</text>

  <!-- SONY WF-1000XM5: LDAC 990kbps -->
  <text class="f name"  x="90" y="452">SONY WF-1000XM5</text>
  <text class="f codec" x="440" y="452">SBC / AAC / LDAC</text>
  <path d="M90 474 L1169 474 Q1179 474 1179 484 L1179 512 Q1179 522 1169 522 L90 522 Z" fill="#b64400"/>
  <text class="f val"   x="1203" y="512">990 kbps</text>

  <text class="f cap" x="90" y="588">
    ※ ビットレートは「音質」そのものではなく、伝送できる情報量の上限です。実際の音は装着状態や音源にも左右されます。
  </text>
  <text class="f cap" x="90" y="620">
    ※ LDAC は送信側の対応が前提です。iPhone は LDAC 非対応のため、iPhone との組み合わせでは AAC 接続になります。
  </text>
</svg>
