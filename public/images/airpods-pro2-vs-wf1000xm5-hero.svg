<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img"
     aria-label="AirPods Pro（第2世代）と SONY WF-1000XM5 の外観イメージ比較イラスト">
  <title>AirPods Pro（第2世代）と SONY WF-1000XM5</title>

  <style>
    .f    { font-family: 'Hiragino Sans','Hiragino Kaku Gothic ProN','Helvetica Neue',Arial,sans-serif; }
    .name { font-size: 46px; font-weight: 600; letter-spacing: -0.015em; fill: #1d1d1f; }
    .sub  { font-size: 26px; fill: #6e6e73; }
    .cap  { font-size: 22px; fill: #86868b; }
    .vs   { font-size: 30px; font-weight: 600; fill: #6e6e73; }
  </style>

  <rect width="1600" height="820" fill="#ffffff"/>
  <rect x="30" y="30" width="1540" height="760" rx="28" fill="#f5f5f7"/>

  <line x1="800" y1="110" x2="800" y2="660" stroke="#d2d2d7" stroke-width="2"/>
  <circle cx="800" cy="385" r="44" fill="#ffffff" stroke="#d2d2d7" stroke-width="2"/>
  <text class="f vs" x="800" y="395" text-anchor="middle">VS</text>

  <!-- ================= 左: AirPods Pro（第2世代） ================= -->
  <g transform="translate(415 0)">
    <!-- イヤホン本体（ステム型） -->
    <g transform="translate(-240 150)">
      <rect x="58" y="130" width="46" height="180" rx="23" fill="#ffffff" stroke="#d2d2d7" stroke-width="3"/>
      <ellipse cx="88" cy="112" rx="66" ry="72" fill="#ffffff" stroke="#d2d2d7" stroke-width="3"/>
      <ellipse cx="26" cy="150" rx="30" ry="34" transform="rotate(-28 26 150)"
               fill="#e8e8ed" stroke="#d2d2d7" stroke-width="3"/>
      <line x1="81" y1="212" x2="81" y2="248" stroke="#d2d2d7" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- 充電ケース（角丸スクエア） -->
    <g transform="translate(-10 195)">
      <rect x="0" y="0" width="262" height="212" rx="58" fill="#ffffff" stroke="#d2d2d7" stroke-width="3"/>
      <line x1="30" y1="66" x2="232" y2="66" stroke="#d2d2d7" stroke-width="2"/>
      <circle cx="131" cy="142" r="9" fill="#86868b"/>
      <circle cx="262" cy="106" r="14" fill="none" stroke="#d2d2d7" stroke-width="3"/>
    </g>

    <text class="f name" x="0" y="540" text-anchor="middle">AirPods Pro</text>
    <text class="f name" x="0" y="594" text-anchor="middle">（第2世代）</text>
    <text class="f sub"  x="0" y="644" text-anchor="middle">ステム型・IP54・空間オーディオ</text>
  </g>

  <!-- ================= 右: SONY WF-1000XM5 ================= -->
  <g transform="translate(1185 0)">
    <!-- イヤホン本体（豆型） -->
    <g transform="translate(-240 150)">
      <path d="M84 24 a86 86 0 0 1 86 86 v36 a78 78 0 0 1 -78 78 h-28
               a74 74 0 0 1 -74 -74 v-44 a82 82 0 0 1 94 -82 z" fill="#1d1d1f"/>
      <circle cx="92" cy="120" r="46" fill="none" stroke="#b08d57" stroke-width="4"/>
      <circle cx="92" cy="120" r="20" fill="#3a3a3d"/>
      <ellipse cx="22" cy="196" rx="30" ry="32" transform="rotate(-28 22 196)" fill="#3a3a3d"/>
    </g>

    <!-- 充電ケース（丸みのある小型ケース） -->
    <g transform="translate(-10 218)">
      <rect x="0" y="0" width="242" height="172" rx="78" fill="#1d1d1f"/>
      <line x1="30" y1="58" x2="212" y2="58" stroke="#3a3a3d" stroke-width="3"/>
      <circle cx="121" cy="118" r="9" fill="#b08d57"/>
    </g>

    <text class="f name" x="0" y="540" text-anchor="middle">SONY</text>
    <text class="f name" x="0" y="594" text-anchor="middle">WF-1000XM5</text>
    <text class="f sub"  x="0" y="644" text-anchor="middle">豆型・LDAC対応・強力ノイキャン</text>
  </g>

  <text class="f cap" x="800" y="742" text-anchor="middle">
    ※ 形状の違いを示すイメージイラストです（実機の写真ではありません）
  </text>
</svg>
