<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img"
     aria-label="EarFun Air Pro 4 のバッテリー内訳。イヤホン本体だけでANCオンの状態で約7時間、充電ケースを併用すると合計30時間を超える。">
  <title>本体7時間、ケース込みで30時間超</title>

  <style>
    .f     { font-family: 'Hiragino Sans','Hiragino Kaku Gothic ProN','Helvetica Neue',Arial,sans-serif; }
    .title { font-size: 38px; font-weight: 600; letter-spacing: -0.015em; fill: #1d1d1f; }
    .lede  { font-size: 24px; fill: #6e6e73; }
    .leg   { font-size: 22px; fill: #6e6e73; }
    .val   { font-size: 30px; font-weight: 600; fill: #1d1d1f; }
    .total { font-size: 34px; font-weight: 600; fill: #1d1d1f; }
    .cap   { font-size: 21px; fill: #86868b; }
  </style>

  <rect width="1600" height="620" fill="#ffffff"/>
  <rect x="30" y="30" width="1540" height="560" rx="28" fill="#f5f5f7"/>

  <text class="f title" x="90" y="118">本体7時間、ケース込みで30時間超</text>
  <text class="f lede"  x="90" y="164">EarFun Air Pro 4 のバッテリー内訳（ANCオン時）</text>

  <!-- 凡例 -->
  <g transform="translate(90 220)">
    <rect x="0" y="-16" width="20" height="20" rx="5" fill="#0071e3"/>
    <text class="f leg" x="32" y="0">イヤホン本体だけの再生時間</text>
    <rect x="330" y="-16" width="20" height="20" rx="5" fill="#b64400"/>
    <text class="f leg" x="362" y="0">充電ケースでの追加分</text>
  </g>

  <!-- 積み上げ横棒: 本体7h + ケース分23h = 30h超 -->
  <rect x="90" y="290" width="326" height="64" rx="10" fill="#0071e3"/>
  <rect x="420" y="290" width="1000" height="64" rx="10" fill="#b64400"/>

  <text class="f val" x="90" y="392">本体 約7時間</text>
  <text class="f val" x="420" y="392">ケース込みで合計 約30時間+</text>

  <line x1="90" y1="420" x2="1510" y2="420" stroke="#d2d2d7" stroke-width="2"/>

  <text class="f cap" x="90" y="470">
    ※ ANC（ノイズキャンセリング）をオンにした状態でのメーカー公表値です。実際の再生時間は音量や音源で変動します。
  </text>
  <text class="f cap" x="90" y="506">
    ※ 出典: EarFun 製品仕様ページ
  </text>
</svg>
